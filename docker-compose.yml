services:
    app:
        image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sleepynoid}/software-spmi-apache:latest
        container_name: spmi-app
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
        user: root
        ports:
            - "${APP_PORT:-8081}:80"
        entrypoint: 
            - sh
            - -c
            - |
              rm -rf bootstrap/cache/*.php
              chmod -R 777 storage bootstrap/cache
              php artisan config:clear
              php artisan migrate --force
              apache2-foreground
        volumes:
            - spmi-storage:/var/www/html/storage
        networks:
            - spmi-network
 
    mysql:
        image: 'mysql:8.4'
        container_name: spmi-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - spmi-mysql:/var/lib/mysql
        networks:
            - spmi-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s

networks:
    spmi-network:
        driver: bridge

volumes:
    spmi-mysql:
    spmi-redis:
    spmi-storage: